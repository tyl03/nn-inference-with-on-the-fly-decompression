[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "nn-compression"
version = "0.1.0"
authors = [
    { name = "Tülin Cetinkaya", email = "tulincetinkaya@gmail.com" }
]
description = "Memory-efficient neural network inference with compression"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"

dependencies = [
    "torch>=1.8.0",
    "torchvision>=0.9.0",
    "numpy>=1.19.0",
    "matplotlib>=3.3.0",
    "zstandard==0.25.0",
]
keywords = ["neural network compression", "model pruning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.0",
]

[project.urls]
Repository = "https://github.com/tyl03/nn-inference-with-on-the-fly-decompression.git"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICEN[CS]E*"]

[tool.setuptools.packages.find]
where = ["src"]